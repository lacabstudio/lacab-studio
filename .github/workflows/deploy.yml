name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le dossier public (pages publiees uniquement)
        run: |
          mkdir -p public/projets
          # Pages de production
          cp index.html a-propos.html cgu.html mentions-legales.html 404.html public/
          cp projets/le-48-64.html \
             projets/les-aventures-de-gudule-et-leon.html \
             projets/les-bulletins-meteo-de-de-paul-langevin.html \
             projets/vis-ton-livre.html \
             public/projets/
          # Assets
          cp -r css js fonts images public/
          # Fichiers GitHub Pages
          cp CNAME .nojekyll public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
